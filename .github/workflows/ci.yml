name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: bin/ci
      - name: Pack release candidates
        run: |
          mkdir -p tmp/release
          npm pack ./packages/sdk --pack-destination tmp/release
          npm pack ./packages/agent --pack-destination tmp/release
      - uses: actions/upload-artifact@v4
        with:
          name: packages-node-${{ matrix.node }}
          path: tmp/release/*.tgz
          retention-days: 7
